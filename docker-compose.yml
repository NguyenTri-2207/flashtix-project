version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flashtix-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - AWS_REGION=ap-southeast-1
      - DYNAMODB_EVENT_TABLE=FlashTix_Events
      - DYNAMODB_BOOKING_TABLE=FlashTix_Bookings
      - FRONTEND_URL=http://localhost:3000
      # Lưu ý: AWS credentials (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY) 
      # nên được set trong file ./backend/.env để không commit lên git
    env_file:
      - ./backend/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - flashtix-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Build args: NEXT_PUBLIC_* variables must be set at BUILD TIME
        # Next.js embeds these into the JavaScript bundle during build
        - NEXT_PUBLIC_API_URL=http://localhost:5000/api/v1
        - NEXT_PUBLIC_AWS_REGION=ap-southeast-1
        # Cognito config: Set these in your .env.local or override here
        # - NEXT_PUBLIC_COGNITO_USER_POOL_ID=${NEXT_PUBLIC_COGNITO_USER_POOL_ID}
        # - NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID=${NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID}
    container_name: flashtix-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Lưu ý: NEXT_PUBLIC_* variables đã được embed vào build, 
      # không cần set lại ở runtime (nhưng set cũng không sao)
    env_file:
      - ./frontend/.env.local
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - flashtix-network

networks:
  flashtix-network:
    driver: bridge

